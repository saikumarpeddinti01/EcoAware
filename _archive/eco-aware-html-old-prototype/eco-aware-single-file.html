<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Eco Aware</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ===== css/styles.css ===== */
/* ==========================================================================
   ECO AWARE — DESIGN TOKENS
   Page 1 (Home) is the master visual reference. Every color, radius and
   shadow used across the app is defined ONCE here and consumed everywhere
   via var(--token). Don't hard-code colors in page-specific CSS.
   ========================================================================== */

:root {
  /* Brand green */
  --primary-green: #1e8449;
  --primary-green-dark: #166638;
  --primary-green-light: #e8f5ec;

  /* Neutrals */
  --background: #f4f6f5;
  --card-background: #ffffff;
  --text-primary: #1a2b22;
  --text-secondary: #6b7a72;
  --border: #e3e8e5;

  /* Status colors */
  --success: #1e8449;
  --success-bg: #e8f5ec;
  --warning: #b7791f;
  --warning-bg: #fdf3dc;
  --info: #2563eb;
  --info-bg: #e8f0fe;
  --danger: #c0392b;

  /* Category tints */
  --cat-water: #2563eb;
  --cat-water-bg: #e8f0fe;
  --cat-waste: #c0392b;
  --cat-waste-bg: #fbe7e5;
  --cat-energy: #b7791f;
  --cat-energy-bg: #fdf3dc;
  --cat-general: #1e8449;
  --cat-general-bg: #e8f5ec;

  /* The ONE floating camera button gradient — Page 1 is the source of truth.
     Used only by .camera-fab. Change it here to change every camera button. */
  --camera-gradient: linear-gradient(135deg, #1e8449 0%, #2563eb 55%, #7c3aed 100%);
  --camera-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);

  /* Sign-in / auth screens (role, profile, sign-up, verify). Colors sampled from the design PDF.
     The three login screens use a slightly different set — see .auth-theme-login in css/auth.css. */
  --auth-green: #13b466;
  --auth-green-dark: #0f9c58;
  --auth-green-soft: #e0f6ea;
  --auth-panel: #143d2b;
  --auth-surface: #f0f4f3;
  --auth-input: #f0f4f3;

  /* Shape & elevation */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 3px rgba(16, 24, 20, 0.06), 0 1px 2px rgba(16, 24, 20, 0.04);
  --shadow-nav: 0 -2px 12px rgba(16, 24, 20, 0.06);

  /* Layout */
  --max-width: 1040px;
  --header-height: 64px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--background);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.page-content {
  flex: 1;
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 24px 24px 120px;
}

@media (max-width: 640px) {
  .page-content { padding: 16px 16px 120px; }
}

/* ==========================================================================
   HEADER
   ========================================================================== */

.site-header {
  background: var(--primary-green);
  color: #fff;
  height: var(--header-height);
  display: flex;
  align-items: center;
  position: relative;
  z-index: 20;
}

.site-header .inner {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

.brand .logo-mark {
  width: 30px;
  height: 30px;
  background: #fff;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary-green);
  font-size: 16px;
}

.brand .brand-name {
  font-weight: 700;
  font-size: 17px;
}

.header-nav {
  display: flex;
  align-items: center;
  gap: 28px;
}

.header-nav a {
  font-size: 14px;
  font-weight: 500;
  opacity: 0.9;
}

.header-nav a.active {
  font-weight: 700;
  opacity: 1;
}

.lang-pill,
.menu-btn {
  background: rgba(255, 255, 255, 0.18);
  border: none;
  color: #fff;
  border-radius: var(--radius-pill);
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}

.header-nav .header-auth-btn {
  background: #fff;
  color: var(--primary-green);
  border: none;
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
  white-space: nowrap;
  opacity: 1;
}

.header-nav .header-auth-btn:hover { opacity: 0.92; }

.menu-btn {
  border-radius: 8px;
  width: 34px;
  height: 34px;
  padding: 0;
  justify-content: center;
  font-size: 16px;
}

.mobile-menu {
  display: none;
  position: absolute;
  top: 100%;
  right: 24px;
  background: var(--card-background);
  color: var(--text-primary);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 8px;
  min-width: 180px;
}

.mobile-menu.open {
  display: block;
}

.mobile-menu a {
  display: block;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
}

.mobile-menu a:hover {
  background: var(--background);
}

@media (max-width: 760px) {
  .header-nav-links {
    display: none;
  }
}

/* ==========================================================================
   BREADCRUMB
   ========================================================================== */

.breadcrumb {
  border-bottom: 1px solid var(--border);
  background: var(--card-background);
}

.breadcrumb .inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 12px 24px;
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.breadcrumb .crumb.current {
  color: var(--primary-green);
  font-weight: 600;
}

/* ==========================================================================
   CAMERA FLOATING BUTTON — the ONE implementation, used on every page.
   ========================================================================== */

.camera-fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--camera-gradient);
  box-shadow: var(--camera-shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: #fff;
  font-size: 22px;
}

/* ==========================================================================
   BOTTOM NAVIGATION
   ========================================================================== */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card-background);
  box-shadow: var(--shadow-nav);
  z-index: 30;
}

.bottom-nav .inner {
  max-width: var(--max-width);
  margin: 0 auto;
  display: flex;
  align-items: center;
  padding: 10px 20px;
  position: relative;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  flex: 1;
}

.nav-item.active {
  color: var(--primary-green);
  font-weight: 600;
}

.nav-item .icon {
  font-size: 19px;
  line-height: 1;
}

.nav-camera-slot {
  flex: 1;
  display: flex;
  justify-content: center;
}

.nav-camera-slot .camera-fab {
  margin-top: -28px;
}

/* ==========================================================================
   FOOTER
   ========================================================================== */

.site-footer {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-secondary);
  font-size: 13px;
}

/* ==========================================================================
   CARD
   ========================================================================== */

.card {
  background: var(--card-background);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-card);
}

/* ==========================================================================
   BADGES
   ========================================================================== */

.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  border-radius: var(--radius-pill);
  padding: 4px 12px;
  white-space: nowrap;
}

.badge-resolved { color: var(--success); background: var(--success-bg); }
.badge-in-progress { color: var(--warning); background: var(--warning-bg); }
.badge-pending { color: var(--info); background: var(--info-bg); }

.cat-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  padding: 3px 10px;
}

.cat-water { color: var(--cat-water); background: var(--cat-water-bg); }
.cat-waste { color: var(--cat-waste); background: var(--cat-waste-bg); }
.cat-energy { color: var(--cat-energy); background: var(--cat-energy-bg); }
.cat-general { color: var(--cat-general); background: var(--cat-general-bg); }

/* ==========================================================================
   BUTTONS
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  border-radius: var(--radius-sm);
  padding: 13px 22px;
  border: none;
  transition: opacity 0.15s ease;
}

.btn:hover { opacity: 0.92; }

.btn-primary { background: var(--primary-green); color: #fff; }
.btn-full { width: 100%; }

.btn-pill-outline {
  background: #fff;
  color: var(--primary-green);
  border: 1px solid var(--primary-green);
  border-radius: var(--radius-pill);
}

.btn-pill-white {
  background: #fff;
  color: var(--primary-green);
  border-radius: var(--radius-pill);
}

/* ==========================================================================
   FORM CONTROLS
   ========================================================================== */

.field-label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
}

.field-label .req { color: var(--danger); }

.field-control {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  background: #fff;
  outline: none;
}

.field-control:focus {
  border-color: var(--primary-green);
}

select.field-control {
  appearance: none;
}

.select-wrap {
  position: relative;
}

.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  pointer-events: none;
}

textarea.field-control {
  resize: vertical;
}

.field-error {
  color: var(--danger);
  font-size: 12.5px;
  margin-top: 6px;
}

.info-box {
  background: var(--success-bg);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13.5px;
  color: var(--text-primary);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.info-box.tone-notice {
  background: var(--info-bg);
}

.form-group {
  margin-bottom: 22px;
}

/* ==========================================================================
   HOME PAGE
   ========================================================================== */

.hero {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  min-height: 220px;
  display: flex;
  align-items: center;
  padding: 40px;
  margin-bottom: 24px;
  background-image: linear-gradient(120deg, rgba(20, 90, 55, 0.92), rgba(30, 132, 73, 0.75)),
    url('https://images.unsplash.com/photo-1518005020951-eccb494ad742?q=80&w=1400&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
}

.hero .inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  flex-wrap: wrap;
  gap: 20px;
}

.hero h1 {
  color: #fff;
  font-size: 32px;
  margin: 0 0 12px;
}

.hero p {
  color: rgba(255, 255, 255, 0.9);
  font-size: 15px;
  margin: 0;
  line-height: 1.6;
  max-width: 480px;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

@media (max-width: 700px) {
  .stats-grid { grid-template-columns: 1fr; }
}

.card-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.card-header-row h3 { margin: 0; font-size: 16px; }

.stat-row { display: flex; gap: 24px; }
.stat-divider { width: 1px; background: var(--border); }
.stat-value { font-size: 26px; font-weight: 700; color: var(--primary-green); }
.stat-label { font-size: 12.5px; color: var(--text-secondary); }

.activity-empty {
  text-align: center;
  padding: 18px 8px;
  color: var(--text-secondary);
}

.activity-empty .title {
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-primary);
}

.activity-empty .desc { font-size: 13px; line-height: 1.5; }

.guidelines-list {
  margin: 0;
  padding-left: 18px;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.9;
}

/* ==========================================================================
   REPORT ISSUE PAGE
   ========================================================================== */

.capture-box {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  background: #fafcfb;
}

.capture-box.has-image {
  background: transparent;
  padding: 12px;
}

.capture-box img {
  max-height: 180px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  margin: 0 auto;
}

.capture-icon-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--primary-green-light);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  color: var(--primary-green);
  font-size: 18px;
}

.capture-box .hint {
  font-size: 14px;
  color: var(--text-secondary);
}

/* ==========================================================================
   FEEDBACK PAGE
   ========================================================================== */

.star-row { display: flex; gap: 6px; }

.star-btn {
  background: none;
  border: none;
  padding: 2px;
  font-size: 26px;
  color: var(--border);
}

.star-btn.filled { color: #e0a63e; }

/* ==========================================================================
   MY REPORTS PAGE
   ========================================================================== */

.filter-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.tab-btn {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-primary);
  border-radius: var(--radius-pill);
  padding: 8px 18px;
  font-size: 13.5px;
  font-weight: 600;
}

.tab-btn.active {
  border: none;
  background: var(--primary-green);
  color: #fff;
}

.report-card { margin-bottom: 16px; }

.report-card-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.report-card-top h3 { margin: 0; font-size: 16px; }

.report-card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-secondary);
}

.report-card-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0 0 14px;
  line-height: 1.5;
}

.report-card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.report-card-id {
  font-size: 12.5px;
  color: var(--text-secondary);
}

.view-details-link {
  background: none;
  border: none;
  color: var(--primary-green);
  font-weight: 600;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.empty-state {
  text-align: center;
  color: var(--text-secondary);
  padding: 40px 0;
}

/* ==========================================================================
   REPORT DETAIL PAGES
   ========================================================================== */

.detail-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 8px;
}

.detail-top h1 { font-size: 24px; margin: 0; }

.detail-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  font-size: 13.5px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.notice-box {
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
  font-size: 14px;
}

.notice-success { background: var(--success-bg); color: var(--text-primary); }
.notice-info { background: var(--info-bg); color: var(--text-primary); }

.notice-warning-block {
  background: var(--warning-bg);
  color: var(--warning);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 600;
}

.section-title { font-size: 15px; margin: 0 0 12px; }

.image-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 22px;
}

@media (max-width: 600px) {
  .image-grid { grid-template-columns: 1fr; }
}

.image-block {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
}

.image-block img { width: 100%; height: 190px; object-fit: cover; }

.image-tag {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

.tag-before { color: var(--danger); }
.tag-after { color: var(--success); }

.summary-row {
  display: flex;
  gap: 16px;
  margin-bottom: 10px;
  font-size: 14px;
}

.summary-row .label {
  width: 130px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

/* ==========================================================================
   TIMELINE
   ========================================================================== */

.timeline-step {
  display: flex;
  gap: 14px;
}

.timeline-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.timeline-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
  background: var(--border);
}

.timeline-dot.done { background: var(--success); }
.timeline-dot.active { background: var(--warning); }

.timeline-line {
  width: 2px;
  flex: 1;
  background: var(--border);
  min-height: 28px;
}

.timeline-body { padding-bottom: 18px; }
.timeline-body:last-child { padding-bottom: 0; }

.timeline-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
.timeline-title.active { color: var(--warning); }
.timeline-date { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
.timeline-note { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* ==========================================================================
   PLACEHOLDER PAGE
   ========================================================================== */

.placeholder-title { font-size: 26px; margin: 0 0 6px; }
.placeholder-desc { color: var(--text-secondary); margin: 0 0 24px; font-size: 14.5px; }

/* ===== css/auth.css ===== */
/* ==========================================================================
   AUTH SCREENS — role select, profile select, sign-up, verify, logins.
   Loaded AFTER css/styles.css (reuses its reset + tokens). Every class here
   is prefixed `auth-` so it can never collide with the main app styles.
   Colors come from the --auth-* tokens at the top of styles.css.
   ========================================================================== */

.auth-page {
  background: #fff;
}

[data-icon] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

[data-icon] svg {
  width: 1em;
  height: 1em;
}

.auth-page :focus-visible {
  outline: 2px solid var(--auth-green);
  outline-offset: 2px;
}

.auth-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* --------------------------------------------------------------------------
   Top bar
   -------------------------------------------------------------------------- */

.auth-header {
  position: relative;
  z-index: 20;
  height: 64px;
  background: #fff;
  border-bottom: 1px solid var(--border);
}

.auth-header .inner {
  height: 100%;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  color: var(--text-primary);
}

.auth-logo {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--auth-green);
  color: #fff;
  font-size: 16px;
}

.auth-nav {
  display: flex;
  align-items: center;
  gap: 20px;
}

.auth-nav-links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.auth-nav-link {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-primary);
}

.auth-nav-link:hover { color: var(--auth-green); }

.auth-nav-link.active {
  color: var(--auth-green);
  font-weight: 600;
}

.auth-dropdown { position: relative; }

.auth-lang-btn,
.auth-icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: none;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
  padding: 6px 8px;
  border-radius: 8px;
}

.auth-lang-btn:hover,
.auth-icon-btn:hover { background: var(--auth-surface); }

.auth-lang-btn [data-icon],
.auth-icon-btn [data-icon] { font-size: 16px; }

.auth-menu-btn { display: none; }
.auth-header[data-menu="always"] .auth-menu-btn { display: inline-flex; }

.auth-dropdown-menu,
.auth-mobile-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 200px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(16, 24, 20, 0.12);
  padding: 6px;
  z-index: 30;
}

.auth-dropdown-menu[hidden],
.auth-mobile-menu[hidden] { display: none; }

.auth-mobile-menu { right: 24px; top: 100%; margin-top: 6px; }

.auth-dropdown-item,
.auth-mobile-menu a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  border: none;
  background: none;
  text-align: left;
  font-size: 13.5px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--text-primary);
}

.auth-dropdown-item:hover,
.auth-mobile-menu a:hover { background: var(--auth-surface); }

.auth-dropdown-item.selected { font-weight: 600; color: var(--auth-green); }

.auth-dropdown-note {
  font-size: 12px;
  color: var(--text-secondary);
  padding: 8px 12px 6px;
}

/* --------------------------------------------------------------------------
   Buttons
   -------------------------------------------------------------------------- */

.auth-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1.5px solid var(--auth-green);
  background: var(--auth-green);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  border-radius: 10px;
  padding: 0 20px;
  height: 44px;
  transition: background 0.15s ease, opacity 0.15s ease;
}

.auth-btn:hover { background: var(--auth-green-dark); border-color: var(--auth-green-dark); }
.auth-btn:disabled { opacity: 0.65; cursor: not-allowed; }

.auth-btn-block { width: 100%; }

.auth-btn-sm {
  height: 34px;
  padding: 0 14px;
  font-size: 13px;
  border-radius: 8px;
}

.auth-btn-outline {
  background: #fff;
  color: var(--auth-green);
}

.auth-btn-outline:hover {
  background: var(--auth-green-soft);
  border-color: var(--auth-green);
}

.auth-btn [data-icon] { font-size: 15px; }

.auth-btn-caps { letter-spacing: 0.06em; text-transform: uppercase; }

.auth-link {
  color: var(--auth-green);
  font-weight: 700;
  background: none;
  border: none;
  padding: 0;
  font-size: inherit;
  font-family: inherit;
}

.auth-link:hover { text-decoration: underline; }
.auth-link:disabled { color: var(--text-secondary); cursor: not-allowed; text-decoration: none; }

/* --------------------------------------------------------------------------
   Split layout
   -------------------------------------------------------------------------- */

.auth-main {
  flex: 1;
  display: grid;
  grid-template-columns: var(--auth-split, minmax(0, 1fr) minmax(0, 1fr));
}

.auth-split-narrow { --auth-split: minmax(0, 1fr) minmax(0, 2fr); }
.auth-split-login  { --auth-split: minmax(0, 5fr) minmax(0, 7fr); }

.auth-left {
  background: var(--auth-panel);
  color: #fff;
  padding: 56px clamp(28px, 4.5vw, 64px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 32px;
}

.auth-split-narrow .auth-left { padding: 48px clamp(24px, 3vw, 44px); }

.auth-left-body { display: flex; flex-direction: column; }

.auth-left h1 {
  margin: 0 0 10px;
  font-size: 30px;
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.auth-left-sub {
  margin: 0 0 26px;
  font-size: 14px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.72);
  max-width: 420px;
}

.auth-eyebrow-pill {
  align-self: flex-start;
  border: 1px solid rgba(16, 168, 98, 0.6);
  background: rgba(16, 168, 98, 0.15);
  color: #6ee7a8;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 999px;
}

.auth-hero-icon {
  width: 48px;
  height: 48px;
  margin-bottom: 26px;
  font-size: 22px;
  color: #4ade80;
}

.auth-hero-icon.ring {
  border-radius: 50%;
  border: 1px solid rgba(74, 222, 128, 0.35);
  background: rgba(16, 168, 98, 0.15);
}

.auth-hero-icon.tile {
  border-radius: 14px;
  border: 1px solid rgba(74, 222, 128, 0.35);
  background: rgba(16, 168, 98, 0.15);
}

.auth-hero-icon.solid {
  border-radius: 50%;
  background: var(--auth-green);
  color: #fff;
  font-size: 22px;
}

.auth-bullets {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 14px;
}

.auth-bullets li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.92);
}

.auth-bullet {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--auth-green);
  box-shadow: 0 0 0 4px rgba(16, 168, 98, 0.28);
  flex-shrink: 0;
  margin: 0 4px;
}

.auth-bullet-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(16, 168, 98, 0.28);
  color: #4ade80;
  font-size: 14px;
  flex-shrink: 0;
}

.auth-left-bottom { margin-top: auto; }

.auth-stat-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #4ade80;
  margin-bottom: 6px;
}

.auth-stat-text {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.4;
  max-width: 260px;
}

.auth-secure-box {
  border: 1px solid rgba(74, 222, 128, 0.2);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  padding: 14px 16px;
}

.auth-secure-box .auth-stat-label {
  display: flex;
  align-items: center;
  gap: 6px;
}

.auth-secure-box p {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.55;
  color: rgba(255, 255, 255, 0.72);
}

.auth-right {
  background: var(--auth-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.auth-right:focus { outline: none; }

.auth-right-inner {
  width: 100%;
  max-width: 580px;
}

.auth-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--auth-green);
  margin-bottom: 6px;
}

.auth-right-title {
  margin: 0 0 18px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}

/* --------------------------------------------------------------------------
   Role / profile cards
   -------------------------------------------------------------------------- */

.auth-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.auth-role-card {
  background: #fff;
  border-radius: 14px;
  padding: 22px;
  box-shadow: 0 1px 3px rgba(16, 24, 20, 0.06), 0 6px 18px rgba(16, 24, 20, 0.04);
  display: flex;
  flex-direction: column;
}

.auth-role-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.auth-tile {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--auth-green-soft);
  color: var(--auth-green);
  font-size: 19px;
  flex-shrink: 0;
}

.auth-role-head h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
}

.auth-badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
  color: var(--auth-green);
  background: var(--auth-green-soft);
  border-radius: 6px;
  padding: 3px 8px;
}

.auth-role-desc {
  margin: 0 0 16px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-secondary);
}

.auth-features {
  list-style: none;
  margin: 0 0 20px;
  padding: 0;
  display: grid;
  gap: 10px;
  flex: 1;
  align-content: start;
}

.auth-features li {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.4;
}

.auth-features [data-icon] {
  font-size: 15px;
  color: var(--auth-green);
  margin-top: 1px;
  flex-shrink: 0;
}

/* --------------------------------------------------------------------------
   Form card
   -------------------------------------------------------------------------- */

.auth-form-card {
  width: 100%;
  max-width: 440px;
  background: #fff;
  border-radius: 16px;
  padding: 34px 32px;
  box-shadow: 0 1px 3px rgba(16, 24, 20, 0.06), 0 10px 28px rgba(16, 24, 20, 0.06);
}

.auth-form-card h2 {
  margin: 0 0 6px;
  font-size: 20px;
  font-weight: 800;
}

.auth-form-card.center { text-align: center; }
.auth-form-card.center h2 { font-size: 22px; }
.auth-form-card .auth-form-icon + h2 { font-size: 22px; margin-top: 18px; }

.auth-form-sub {
  margin: 0 0 22px;
  font-size: 13px;
  color: var(--text-secondary);
}

.auth-form-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--auth-green-soft);
  color: var(--auth-green);
  font-size: 19px;
  margin-bottom: 14px;
}

.auth-field { margin-bottom: 16px; }

.auth-label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-primary);
  text-align: left;
}

.auth-input-wrap { position: relative; }

.auth-input-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--text-secondary);
  pointer-events: none;
}

.auth-input {
  width: 100%;
  height: 44px;
  border: 1.5px solid transparent;
  background: var(--auth-input);
  border-radius: 10px;
  padding: 0 42px 0 39px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}

.auth-input::placeholder { color: #8e9b95; }

.auth-input:focus {
  background: #fff;
  border-color: var(--auth-green);
  box-shadow: 0 0 0 3px rgba(16, 168, 98, 0.15);
}

.auth-input[aria-invalid="true"] {
  background: #fff;
  border-color: var(--danger);
}

.auth-pw-toggle {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border: none;
  background: none;
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 16px;
}

.auth-pw-toggle:hover { color: var(--text-primary); background: rgba(16, 24, 20, 0.05); }

.auth-field-error {
  color: var(--danger);
  font-size: 12px;
  margin-top: 5px;
  text-align: left;
}

.auth-field-error:empty { display: none; }

.auth-field-hint {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 5px;
}

.auth-row-end {
  display: flex;
  justify-content: flex-end;
  margin: -4px 0 18px;
  font-size: 12px;
}

.auth-alert {
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 16px;
  text-align: left;
}

.auth-alert:empty { display: none; }
.auth-alert.error   { background: #fbe7e5; color: #8f2a20; }
.auth-alert.info    { background: var(--info-bg); color: #1e3f8f; }
.auth-alert.success { background: var(--auth-green-soft); color: #0b6b3d; }

.auth-form-foot {
  margin: 18px 0 0;
  text-align: center;
  font-size: 12.5px;
  color: var(--text-secondary);
}

.auth-form-note {
  margin: 14px 0 0;
  text-align: center;
  font-size: 11px;
  color: var(--text-secondary);
}

/* Demo-mode toast: floats in the corner so it never changes the screen layout. */
.auth-toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 100;
  max-width: 320px;
  background: #0f2a1e;
  color: #fff;
  border-radius: 12px;
  padding: 12px 40px 12px 14px;
  font-size: 12.5px;
  line-height: 1.55;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

.auth-toast code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: rgba(255, 255, 255, 0.14);
  padding: 1px 5px;
  border-radius: 4px;
}

.auth-toast-close {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 26px;
  height: 26px;
  border: none;
  background: none;
  color: rgba(255, 255, 255, 0.7);
  font-size: 18px;
  line-height: 1;
  border-radius: 6px;
}

.auth-toast-close:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

/* --------------------------------------------------------------------------
   Verification (OTP)
   -------------------------------------------------------------------------- */

.auth-ref-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--auth-surface);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 12.5px;
  margin-bottom: 18px;
  text-align: left;
}

.auth-ref-row span:first-child { color: var(--text-secondary); font-weight: 500; }
.auth-ref-row .code { font-weight: 800; letter-spacing: 0.03em; }

.auth-otp {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 6px;
}

.auth-otp-input {
  width: 100%;
  height: 50px;
  border: 1.5px solid #eef1f0;
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-family: inherit;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  outline: none;
  caret-color: var(--auth-green);
}

.auth-otp-input:focus {
  border-color: var(--auth-green);
  box-shadow: 0 0 0 3px rgba(16, 168, 98, 0.15);
}

.auth-otp.invalid .auth-otp-input { border-color: var(--danger); }

/* --------------------------------------------------------------------------
   Simple content pages (About / Legal)
   -------------------------------------------------------------------------- */

.auth-simple {
  flex: 1;
  background: var(--auth-surface);
  padding: 48px 24px;
}

.auth-simple-inner {
  max-width: 720px;
  margin: 0 auto;
  display: grid;
  gap: 20px;
}

.auth-simple h1 { margin: 0 0 6px; font-size: 28px; }
.auth-simple .lead { margin: 0 0 8px; color: var(--text-secondary); font-size: 14.5px; }
.auth-simple .auth-form-card { max-width: none; padding: 26px 28px; }
.auth-simple .auth-form-card h2 { font-size: 17px; }
.auth-simple .auth-form-card p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--text-secondary); }

/* --------------------------------------------------------------------------
   Footer
   -------------------------------------------------------------------------- */

.auth-footer {
  background: #fff;
  border-top: 1px solid var(--border);
}

.auth-footer .inner {
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 24px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-secondary);
}

.auth-footer-brand { display: flex; align-items: center; gap: 8px; }

.auth-footer-mark {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--auth-green);
  color: #fff;
  font-size: 10px;
}

.auth-footer-links { display: flex; gap: 22px; flex-wrap: wrap; }
.auth-footer-links a:hover { color: var(--text-primary); }
.auth-footer-links a.green { color: var(--auth-green); font-weight: 600; }

/* --------------------------------------------------------------------------
   Responsive
   -------------------------------------------------------------------------- */

@media (max-width: 860px) {
  .auth-main,
  .auth-split-narrow,
  .auth-split-login { grid-template-columns: minmax(0, 1fr); }

  .auth-left,
  .auth-split-narrow .auth-left {
    padding: 32px 24px;
    gap: 0;
  }

  .auth-eyebrow-pill { margin-bottom: 18px; }
  .auth-left h1 { font-size: 26px; }
  .auth-left-sub { margin-bottom: 0; }
  .auth-hero-icon { width: 42px; height: 42px; margin-bottom: 18px; }

  /* Keep the stacked panel short so the form is reachable without a long scroll. */
  .auth-bullets,
  .auth-left-bottom { display: none; }

  .auth-right { padding: 28px 16px 40px; }
}

@media (max-width: 720px) {
  .auth-header .inner { padding: 0 16px; }
  .auth-nav-links { display: none; }
  .auth-menu-btn { display: inline-flex; }
  .auth-mobile-menu { right: 12px; }
  .auth-footer .inner { padding: 14px 16px; justify-content: center; text-align: center; }
}

@media (max-width: 560px) {
  .auth-cards { grid-template-columns: minmax(0, 1fr); }
  .auth-form-card { padding: 26px 20px; }
  .auth-otp { gap: 6px; }
  .auth-otp-input { height: 46px; font-size: 17px; }
}

/* --------------------------------------------------------------------------
   LOGIN SCREENS (Reporter / Management / Staff) — <body class="auth-theme-login">
   The design uses a different green, panel color and scale on these three
   screens, with the panel content pinned to the top instead of centered.
   -------------------------------------------------------------------------- */

.auth-theme-login {
  --auth-green: #16a34a;
  --auth-green-dark: #12853c;
  --auth-green-soft: #e4f5ea;
  --auth-panel: #1a4331;
  --auth-surface: #f5f5f5;
  --auth-input: #f6fafd;
}

.auth-theme-login .auth-main { --auth-split: minmax(0, 2fr) minmax(0, 3fr); }

.auth-theme-login .auth-left {
  justify-content: flex-start;
  padding: 64px clamp(28px, 4vw, 56px);
}

.auth-theme-login .auth-hero-icon { width: 56px; height: 56px; font-size: 26px; margin-bottom: 26px; }
.auth-theme-login .auth-left h1 { font-size: 31px; margin-bottom: 12px; }
.auth-theme-login .auth-left-sub { font-size: 15px; line-height: 1.65; max-width: 460px; margin-bottom: 34px; }
.auth-theme-login .auth-bullets { gap: 20px; }
.auth-theme-login .auth-bullets li { font-size: 14px; gap: 14px; }
.auth-theme-login .auth-bullet-icon { width: 28px; height: 28px; font-size: 16px; background: rgba(255, 255, 255, 0.12); color: #7ee2a3; }

.auth-theme-login .auth-form-card {
  max-width: 490px;
  padding: 44px 40px 36px;
  border-radius: 22px;
}

.auth-theme-login .auth-form-card h2 { font-size: 26px; margin-bottom: 8px; }
.auth-theme-login .auth-form-sub { font-size: 14px; margin-bottom: 30px; }
.auth-theme-login .auth-label { font-size: 13px; margin-bottom: 8px; }
.auth-theme-login .auth-field { margin-bottom: 20px; }
.auth-theme-login .auth-input { height: 52px; border-radius: 12px; font-size: 14.5px; }
.auth-theme-login .auth-input:focus { background: #fff; }
.auth-theme-login .auth-row-end { margin: -6px 0 22px; font-size: 12.5px; }
.auth-theme-login .auth-btn-block { height: 52px; border-radius: 12px; font-size: 15px; }
.auth-theme-login .auth-form-foot { margin-top: 22px; font-size: 14px; }
.auth-theme-login .auth-form-note { margin-top: 16px; font-size: 12px; }

.auth-footer-mark.square { border-radius: 5px; }

@media (max-width: 860px) {
  .auth-theme-login .auth-main { --auth-split: minmax(0, 1fr); }
  .auth-theme-login .auth-left { padding: 32px 24px; }
  .auth-theme-login .auth-left h1 { font-size: 28px; }
  .auth-theme-login .auth-left-sub { font-size: 14.5px; margin-bottom: 0; }
  .auth-theme-login .auth-hero-icon { width: 46px; height: 46px; font-size: 22px; margin-bottom: 18px; }
  .auth-theme-login .auth-form-card { padding: 32px 22px 28px; }
}

/* ===== single-file extras: keep the fixed bottom nav clear of phone system bars ===== */
@supports (padding: env(safe-area-inset-bottom)) {
  .bottom-nav { padding-bottom: env(safe-area-inset-bottom, 0px); }
}

</style>
</head>
<body>
<div id="app"></div>

<template id="tpl-index" data-title="Eco Aware — Home" data-body-class="">
<div class="app-shell">
    <div id="header-root"></div>
    <div id="breadcrumb-root"></div>

    <main class="page-content">
      <section class="hero">
        <div class="inner">
          <div>
            <h1>Welcome to Eco Aware</h1>
            <p>
              Your hub for creating a cleaner, greener, and more sustainable campus. Together,
              we can track and resolve environmental impacts in real-time.
            </p>
          </div>
          <a href="report.html" class="btn btn-pill-white">+ File a New Report</a>
        </div>
      </section>

      <section class="stats-grid">
        <div class="card">
          <div class="card-header-row">
            <h3>Campus Eco-Impact</h3>
            <span>📊</span>
          </div>
          <div class="stat-row" id="stats-row"></div>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h3>Recent Green Activities</h3>
            <span>📈</span>
          </div>
          <div class="activity-empty">
            <div class="title">Your activity stream will appear here</div>
            <div class="desc">
              Issues reported and sustainable actions tracked on campus will sync automatically.
            </div>
          </div>
        </div>
      </section>

<script>
const PAGE_SCRIPTS = {};
/* ===== js/data.js ===== */
// Mock/local data only — no backend exists yet.
// Swap getReports()/getReportById() for real fetch() calls once an API exists;
// the shape below is what every page expects back.

const CATEGORIES = [
  { value: 'waste', label: 'Waste' },
  { value: 'water', label: 'Water' },
  { value: 'energy', label: 'Energy' },
  { value: 'general', label: 'General / Other' },
];

const FEEDBACK_CATEGORIES = [
  { value: 'cleanliness', label: 'Campus Cleanliness' },
  { value: 'energy', label: 'Energy' },
  { value: 'water', label: 'Water' },
  { value: 'general', label: 'General' },
];

// Reports live in the browser (localStorage) — there's no backend yet.
// Submitting a report on report.html calls addReport(); every other page
// reads back through getReports()/getReportById().
const REPORTS_KEY = 'ea_reports';

function readReports() {
  try {
    const raw = localStorage.getItem(REPORTS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function writeReports(list) {
  try {
    localStorage.setItem(REPORTS_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    return false;
  }
}

function nextReportId() {
  const year = new Date().getFullYear();
  const n = String(Math.floor(1000 + Math.random() * 9000));
  return `EA-${year}-${n}`;
}

/**
 * @param {{category:string, description:string, photos:string[]}} fields
 * @returns {object} the newly stored report
 */
function addReport(fields) {
  const categoryLabel = (CATEGORIES.find((c) => c.value === fields.category) || {}).label || fields.category;
  const report = {
    id: nextReportId(),
    title: `${categoryLabel} issue: ${fields.description.slice(0, 60)}${fields.description.length > 60 ? '…' : ''}`,
    category: fields.category,
    status: 'pending',
    submittedOn: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }),
    description: fields.description,
    photos: fields.photos || [],
    statusInfo:
      'Your report is currently in the campus sustainability operations queue and will be reviewed by the facilities team shortly.',
    averageReviewTime: '2-3 business days',
  };
  const list = readReports();
  list.unshift(report);
  writeReports(list);
  return report;
}

function getReports() {
  return readReports();
}

function getReportById(id) {
  return readReports().find((r) => r.id === id);
}

/* ===== js/auth.js ===== */
// ============================================================================
// AUTH SERVICE  (frontend-only prototype)
//
// There is no backend yet, so accounts live in the browser (localStorage) and
// the "emailed" verification code is generated locally. This file is the ONLY
// place that knows how auth works — every page calls the `Auth` object below.
// When a real API exists, replace the bodies of these methods with fetch()
// calls and keep the same return shapes; no page code needs to change.
//
// NOTE: client-side auth is NOT secure. It exists so the UI flow can be
// clicked through end to end. Real authentication must be enforced on a server.
// ============================================================================

const AUTH_STORAGE = {
  users: 'ea_users',           // registered reporters (localStorage)
  session: 'ea_session',       // who is signed in (localStorage)
  pending: 'ea_pending_signup' // sign-up awaiting verification (sessionStorage)
};

const OTP_TTL_MS = 10 * 60 * 1000;
const OTP_MAX_ATTEMPTS = 5;

// Where each role lands after a successful sign-in.
const ROLE_HOME = {
  reporter: 'index.html',
  management: 'dashboard.html',
  staff: 'staff.html',
};

// Management and staff accounts are meant to be issued by the sustainability
// office rather than self-registered, so — like reporter — they each get one
// fixed demo account to sign in with straight away. Reporter accounts can
// also be created for real through Sign Up; the demo one is just there too
// so the flow can be tried without going through sign-up first.
const DEMO_ACCOUNTS = [
  { role: 'reporter',   ids: ['alex@university.edu'],                    password: 'Reporter@123', name: 'Alex' },
  { role: 'management', ids: ['manager@ecoaware.org'],                   password: 'Manager@123',  name: 'Campus Manager' },
  { role: 'staff',      ids: ['staff.id@ecoaware.org', 'ea-staff-001'],  password: 'Staff@123',    name: 'Facilities Staff' },
];

// ---- small helpers ---------------------------------------------------------

const AuthStore = {
  read(storage, key, fallback) {
    try {
      const raw = storage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  write(storage, key, value) {
    try {
      storage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  },
  remove(storage, key) {
    try {
      storage.removeItem(key);
    } catch (e) {
      /* storage unavailable — nothing to remove */
    }
  },
};

function randomHex(bytes) {
  const arr = new Uint8Array(bytes);
  crypto.getRandomValues(arr);
  return Array.from(arr, (b) => b.toString(16).padStart(2, '0')).join('');
}

function randomDigits(count) {
  const arr = new Uint32Array(count);
  crypto.getRandomValues(arr);
  return Array.from(arr, (n) => n % 10).join('');
}

async function sha256Hex(text) {
  if (!(window.crypto && crypto.subtle)) {
    throw new Error('crypto-unavailable');
  }
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, '0')).join('');
}

// ---- public API --------------------------------------------------------------

const Auth = {
  ROLE_HOME,

  getSession() {
    return AuthStore.read(localStorage, AUTH_STORAGE.session, null);
  },

  // Call at the very top of any app-page script (before DOMContentLoaded), the
  // same way home.js does. Sends signed-out visitors to Select Your Role and
  // returns false so the caller can bail out before touching the DOM.
  requireSession() {
    if (this.getSession()) return true;
    navigateReplace('role.html');
    return false;
  },

  logout() {
    AuthStore.remove(localStorage, AUTH_STORAGE.session);
  },

  _startSession(role, name, id) {
    const session = { role, name, id, at: Date.now() };
    AuthStore.write(localStorage, AUTH_STORAGE.session, session);
    return session;
  },

  /**
   * Step 1 of reporter sign-up. Validates uniqueness, stores a pending record
   * (password already hashed) and generates the verification code.
   * @returns {Promise<{ok:true, pending:object} | {ok:false, field?:string, error:string}>}
   */
  async startSignUp({ email, username, phone, password }) {
    const emailKey = email.trim().toLowerCase();
    const userKey = username.trim().toLowerCase();
    const users = AuthStore.read(localStorage, AUTH_STORAGE.users, []);

    const emailTaken =
      users.some((u) => u.email === emailKey) ||
      DEMO_ACCOUNTS.some((a) => a.role === 'reporter' && a.ids.includes(emailKey));
    if (emailTaken) {
      return { ok: false, field: 'email', error: 'An account with this email already exists.' };
    }
    if (users.some((u) => u.usernameKey === userKey)) {
      return { ok: false, field: 'username', error: 'That username is already taken.' };
    }

    let salt;
    let hash;
    try {
      salt = randomHex(16);
      hash = await sha256Hex(salt + password);
    } catch (e) {
      return {
        ok: false,
        error: 'Secure storage is unavailable in this browser context. Open the site via http://localhost instead of a plain file.',
      };
    }

    const pending = {
      email: emailKey,
      username: username.trim(),
      usernameKey: userKey,
      phone: phone.trim(),
      salt,
      hash,
      referenceCode: 'REF-EA' + randomDigits(4),
      code: randomDigits(6), // a real backend would email this and never send it to the browser
      expiresAt: Date.now() + OTP_TTL_MS,
      attempts: 0,
    };

    if (!AuthStore.write(sessionStorage, AUTH_STORAGE.pending, pending)) {
      return { ok: false, error: 'Could not save your sign-up in this browser. Check that storage is enabled.' };
    }
    return { ok: true, pending };
  },

  getPending() {
    return AuthStore.read(sessionStorage, AUTH_STORAGE.pending, null);
  },

  /** Issues a fresh code (and resets the attempt counter). */
  resendCode() {
    const pending = this.getPending();
    if (!pending) return null;
    pending.code = randomDigits(6);
    pending.expiresAt = Date.now() + OTP_TTL_MS;
    pending.attempts = 0;
    AuthStore.write(sessionStorage, AUTH_STORAGE.pending, pending);
    return pending;
  },

  /**
   * Step 2 of reporter sign-up. On success the account is created and the
   * reporter is signed in.
   * @returns {{ok:true, session:object} | {ok:false, reason?:string, error:string}}
   */
  verifyCode(input) {
    const pending = this.getPending();
    if (!pending) {
      return { ok: false, reason: 'no-pending', error: 'Your sign-up session has expired. Please start again.' };
    }
    if (Date.now() > pending.expiresAt) {
      return { ok: false, error: 'This code has expired. Please request a new one.' };
    }
    if (pending.attempts >= OTP_MAX_ATTEMPTS) {
      return { ok: false, error: 'Too many incorrect attempts. Please request a new code.' };
    }
    if (input !== pending.code) {
      pending.attempts += 1;
      AuthStore.write(sessionStorage, AUTH_STORAGE.pending, pending);
      const left = OTP_MAX_ATTEMPTS - pending.attempts;
      return {
        ok: false,
        error: left > 0
          ? `That code is incorrect. ${left} ${left === 1 ? 'attempt' : 'attempts'} left.`
          : 'Too many incorrect attempts. Please request a new code.',
      };
    }

    const users = AuthStore.read(localStorage, AUTH_STORAGE.users, []);
    users.push({
      email: pending.email,
      username: pending.username,
      usernameKey: pending.usernameKey,
      phone: pending.phone,
      salt: pending.salt,
      hash: pending.hash,
      role: 'reporter',
      createdAt: Date.now(),
    });
    if (!AuthStore.write(localStorage, AUTH_STORAGE.users, users)) {
      return { ok: false, error: 'Could not save your account in this browser. Check that storage is enabled.' };
    }
    AuthStore.remove(sessionStorage, AUTH_STORAGE.pending);
    return { ok: true, session: this._startSession('reporter', pending.username, pending.email) };
  },

  /**
   * @param {'reporter'|'management'|'staff'} role
   * @param {string} identifier - email (reporter/management) or staff ID / email (staff)
   * @returns {Promise<{ok:true, session:object} | {ok:false, error:string}>}
   */
  async login(role, identifier, password) {
    const id = identifier.trim().toLowerCase();
    const genericError = { ok: false, error: 'Incorrect email or password. Please try again.' };

    const demo = DEMO_ACCOUNTS.find((a) => a.role === role && a.ids.includes(id));
    if (demo) {
      return demo.password === password
        ? { ok: true, session: this._startSession(role, demo.name, id) }
        : genericError;
    }

    if (role === 'reporter') {
      const users = AuthStore.read(localStorage, AUTH_STORAGE.users, []);
      const user = users.find((u) => u.email === id);
      if (user) {
        try {
          const hash = await sha256Hex(user.salt + password);
          if (hash === user.hash) {
            return { ok: true, session: this._startSession('reporter', user.username, user.email) };
          }
        } catch (e) {
          return {
            ok: false,
            error: 'Secure storage is unavailable in this browser context. Open the site via http://localhost instead of a plain file.',
          };
        }
      }
    }

    return genericError;
  },
};

/* ===== js/components.js ===== */
// ============================================================================
// SHARED COMPONENTS
// These functions are the single source of truth for markup that repeats on
// every page. In particular, renderBottomNav() is the ONLY place in the whole
// project that draws the floating camera button — every page calls it, so
// there is exactly one camera button design across the entire app.
// ============================================================================

const NAV_LINKS = [
  { label: 'Home', href: 'index.html' },
  { label: 'Dashboard', href: 'dashboard.html' },
  { label: 'Service', href: 'report.html' },
  { label: 'Contact Us', href: 'contact.html' },
];

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/**
 * @param {string} activeHref - current page's file name, e.g. "index.html"
 */
function renderHeader(activeHref) {
  const root = document.getElementById('header-root');
  if (!root) return;

  const linksHtml = NAV_LINKS.map(
    (link) =>
      `<a href="${link.href}" class="${link.href === activeHref ? 'active' : ''}">${link.label}</a>`
  ).join('');

  // Sign In / Sign Out (session comes from js/auth.js)
  const session = typeof Auth !== 'undefined' ? Auth.getSession() : null;
  const authBtnHtml = session
    ? `<button type="button" class="header-auth-btn" id="signout-btn" title="Signed in as ${escapeHtml(session.name)}">Sign Out</button>`
    : `<a href="role.html" class="header-auth-btn">Sign In</a>`;

  root.innerHTML = `
    <header class="site-header">
      <div class="inner">
        <a href="index.html" class="brand">
          <span class="logo-mark">🍃</span>
          <span class="brand-name">Eco Aware</span>
        </a>
        <nav class="header-nav">
          <span class="header-nav-links" style="display:flex; gap:28px;">${linksHtml}</span>
          <button class="lang-pill">🌐 EN ▾</button>
          ${authBtnHtml}
          <button class="menu-btn" id="mobile-menu-toggle" aria-label="Open menu">☰</button>
        </nav>
      </div>
      <div class="mobile-menu" id="mobile-menu">${linksHtml}</div>
    </header>
  `;

  const signOut = document.getElementById('signout-btn');
  if (signOut) {
    signOut.addEventListener('click', () => {
      Auth.logout();
      navigate('role.html');
    });
  }

  const toggle = document.getElementById('mobile-menu-toggle');
  const menu = document.getElementById('mobile-menu');
  if (toggle && menu) {
    toggle.addEventListener('click', () => menu.classList.toggle('open'));
  }
}

/**
 * @param {Array<{label: string, href?: string}>} trail - last item has no href (current page)
 */
function renderBreadcrumb(trail) {
  const root = document.getElementById('breadcrumb-root');
  if (!root) return;

  const html = trail
    .map((item, i) => {
      const isLast = i === trail.length - 1;
      const sep = isLast ? '' : '<span>/</span>';
      const crumb =
        item.href && !isLast
          ? `<a href="${item.href}">${escapeHtml(item.label)}</a>`
          : `<span class="crumb ${isLast ? 'current' : ''}">${escapeHtml(item.label)}</span>`;
      return `<span style="display:flex; gap:6px;">${crumb}${sep}</span>`;
    })
    .join('');

  root.innerHTML = `
    <div class="breadcrumb">
      <div class="inner">${html}</div>
    </div>
  `;
}

/**
 * The ONE camera floating button implementation. Style source of truth:
 * --camera-gradient / --camera-shadow in css/styles.css.
 */

  return `
    <a href="report.html" class="camera-fab" aria-label="Report an issue">📷</a>
  `;
}

/**
 * @param {string} activePage - one of 'home' | 'feedback' | 'reports' | 'staff' | ''

function renderBottomNav(activePage) {

        </a>

function renderFooter() {

  root.innerHTML = `
    <footer class="site-footer">
      <div>© 2024 Eco Aware. All rights reserved.</div>
      <div>Committed to a greener, cleaner campus.</div>

function statusBadgeHtml(status) {
  const map = {
    resolved: { label: 'Resolved', cls: 'badge-resolved' },
    'in-progress': { label: 'In Progress', cls: 'badge-in-progress' },

  return `<span class="badge ${s.cls}">${s.label}</span>`;
}

function categoryBadgeHtml(category) {
  const map = {

function authIcon(name) {
  const paths = AUTH_ICONS[name];
  if (!paths) return '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths}</svg>`;
}

/** Replaces every <span data-icon="x"> inside `root` with inline SVG. */
function hydrateIcons(root) {
  (root || document).querySelectorAll('[data-icon]').forEach((el) => {
    el.innerHTML = authIcon(el.getAttribute('data-icon'));
    el.setAttribute('aria-hidden', 'true');
  });
}

function authEscape(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/**

 * @param {string}  [opts.backHref='role.html']

 * @param {boolean} [opts.showLang=false]  language picker + always-visible menu button

function renderAuthHeader(opts) {

/** Toggle a popover; close on outside click or Escape. */
function wirePopover(buttonId, menuId) {
  const btn = document.getElementById(buttonId);
  const menu = document.getElementById(menuId);
  if (!btn || !menu) return;

  const close = () => {
    menu.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
  };

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const willOpen = menu.hidden;
    document.querySelectorAll('.auth-dropdown-menu, .auth-mobile-menu').forEach((m) => (m.hidden = true));
    document.querySelectorAll('[aria-controls][aria-expanded]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    menu.hidden = !willOpen;
    btn.setAttribute('aria-expanded', String(willOpen));
  });

  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && e.target !== btn) close();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !menu.hidden) {
      close();
      btn.focus();
    }
  });
}

/** Small dismissible note in the corner (used for demo credentials / codes). */
function showDemoToast(html) {

/** Wires every <button data-toggle-password="inputId"> to show/hide that input. */
function initPasswordToggles() {
  document.querySelectorAll('[data-toggle-password]').forEach((btn) => {
    const input = document.getElementById(btn.getAttribute('data-toggle-password'));
    if (!input) return;
    const icon = btn.querySelector('[data-icon], .auth-pw-icon');
    btn.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      if (icon) {
        icon.className = 'auth-pw-icon';
        icon.innerHTML = authIcon(show ? 'eye-off' : 'eye');
      }
    });
  });
}

/** Show (or clear, with '') an inline error under an input with id="<id>-error". */
function setFieldError(input, message) {
  const err = document.getElementById(input.id + '-error');
  if (err) err.textContent = message || '';
  if (message) input.setAttribute('aria-invalid', 'true');
  else input.removeAttribute('aria-invalid');
}

/** Show a banner in an element: type is 'error' | 'info' | 'success'. Pass '' to clear. */
function showAlert(el, type, message) {
  if (!el) return;
  el.className = 'auth-alert ' + (message ? type : '');
  el.textContent = message || '';
}

const AUTH_VALIDATORS = {
  email(value) {
    if (!value.trim()) return 'Please enter your email address.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value.trim())) return 'Please enter a valid email address.';
    return '';
  },
  username(value) {
    const v = value.trim();
    if (!v) return 'Please choose a username.';
    if (!/^[A-Za-z0-9_.-]{3,20}$/.test(v)) return 'Use 3–20 letters, numbers, dots, dashes or underscores.';
    return '';
  },
  phone(value) {
    const v = value.trim();
    if (!v) return 'Please enter your phone number.';
    if (!/^\+?[\d\s().-]+$/.test(v)) return 'Phone number can only contain digits, spaces and + ( ) - .';
    const digits = v.replace(/\D/g, '');
    if (digits.length < 7 || digits.length > 15) return 'Please enter a valid phone number.';
    return '';
  },
  newPassword(value) {
    if (!value) return 'Please create a password.';
    if (value.length < 8) return 'Password must be at least 8 characters.';
    if (!/[A-Za-z]/.test(value) || !/\d/.test(value)) return 'Password needs at least one letter and one number.';
    return '';
  },
};

    const reader = new FileReader();

    reader.readAsDataURL(file);
  });

  const form = document.getElementById('report-form');

    let valid = true;

    const categoryError = document.getElementById('category-error');
    if (!categorySelect.value) {
      categoryError.textContent = 'Please select a category.';
      categoryError.style.display = 'block';
      valid = false;
    } else {
      categoryError.style.display = 'none';
    }

    const description = document.getElementById('description');
    const descriptionError = document.getElementById('description-error');
    if (!description.value.trim()) {
      descriptionError.textContent = 'Please describe the issue.';
      descriptionError.style.display = 'block';
      valid = false;
    } else {
      descriptionError.style.display = 'none';
    }

    if (!photoDataUrl) {
      photoError.textContent = 'Please capture or upload a photo.';
      photoError.style.display = 'block';
      valid = false;

      photoError.style.display = 'none';

PAGE_SCRIPTS["reporter-signup"] = function () {
/* js/reporter-signup.js */
onReady( () => {
  renderAuthShell({ showLang: true, right: 'back', backHref: 'reporter-login.html' });
  initPasswordToggles();

  const form = document.getElementById('signup-form');
  const alertBox = document.getElementById('form-alert');
  const submitBtn = document.getElementById('submit-btn');

  const fields = {
    email: document.getElementById('email'),
    username: document.getElementById('username'),
    phone: document.getElementById('phone'),
    password: document.getElementById('password'),
  };

  const rules = {
    email: AUTH_VALIDATORS.email,
    username: AUTH_VALIDATORS.username,
    phone: AUTH_VALIDATORS.phone,
    password: AUTH_VALIDATORS.newPassword,
  };

  // Validate a field when the user leaves it, and clear its error as they fix it.
  Object.keys(fields).forEach((name) => {
    fields[name].addEventListener('blur', () => setFieldError(fields[name], rules[name](fields[name].value)));
    fields[name].addEventListener('input', () => {
      if (fields[name].hasAttribute('aria-invalid')) setFieldError(fields[name], rules[name](fields[name].value));
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showAlert(alertBox, 'error', '');

    let firstInvalid = null;
    Object.keys(fields).forEach((name) => {
      const message = rules[name](fields[name].value);
      setFieldError(fields[name], message);
      if (message && !firstInvalid) firstInvalid = fields[name];
    });
    if (firstInvalid) {
      firstInvalid.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    const result = await Auth.startSignUp({
      email: fields.email.value,
      username: fields.username.value,
      phone: fields.phone.value,
      password: fields.password.value,
    });

    if (!result.ok) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign Up';
      if (result.field && fields[result.field]) {
        setFieldError(fields[result.field], result.error);
        fields[result.field].focus();
      } else {
        showAlert(alertBox, 'error', result.error);
      }
      return;
    }

    navigate('reporter-verify.html');
  });
});

};
PAGE_SCRIPTS["reporter-verify"] = function () {
/* js/reporter-verify.js */
onReady( () => {
  renderAuthShell({ showLang: true, right: 'back', backHref: 'reporter-signup.html' });

  // No pending sign-up (page opened directly, or the tab was closed) → start over.
  const pending = Auth.getPending();
  if (!pending) {
    navigateReplace('reporter-signup.html');
    return;
  }

  const form = document.getElementById('verify-form');
  const alertBox = document.getElementById('form-alert');
  const submitBtn = document.getElementById('submit-btn');
  const resendBtn = document.getElementById('resend-btn');
  const otpWrap = document.getElementById('otp');
  const inputs = Array.from(otpWrap.querySelectorAll('.auth-otp-input'));

  document.getElementById('reference-code').textContent = pending.referenceCode;

  // No backend, so no email is actually sent — this is the only way to get the code.
  function renderVerificationHint(code) {
    showDemoToast(`<strong>No backend yet:</strong> no email is sent.<br>Your code is <code>${authEscape(code)}</code>`);
  }
  renderVerificationHint(pending.code);

  // ---- 6-box code input ------------------------------------------------------
  const clearInvalid = () => otpWrap.classList.remove('invalid');

  inputs.forEach((input, i) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(-1);
      clearInvalid();
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && i > 0) {
        inputs[i - 1].value = '';
        inputs[i - 1].focus();
        e.preventDefault();
      } else if (e.key === 'ArrowLeft' && i > 0) {
        inputs[i - 1].focus();
        e.preventDefault();
      } else if (e.key === 'ArrowRight' && i < inputs.length - 1) {
        inputs[i + 1].focus();
        e.preventDefault();
      }
    });

    input.addEventListener('focus', () => input.select());

    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, inputs.length);
      if (!digits) return;
      digits.split('').forEach((d, j) => (inputs[j].value = d));
      clearInvalid();
      inputs[Math.min(digits.length, inputs.length - 1)].focus();
    });
  });

  inputs[0].focus();

  // ---- submit ------------------------------------------------------------------
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const code = inputs.map((i) => i.value).join('');

    if (code.length < inputs.length) {
      otpWrap.classList.add('invalid');
      showAlert(alertBox, 'error', 'Please enter all 6 digits of your verification code.');
      (inputs.find((i) => !i.value) || inputs[0]).focus();
      return;
    }

    const result = Auth.verifyCode(code);
    if (!result.ok) {
      if (result.reason === 'no-pending') {
        navigateReplace('reporter-signup.html');
        return;
      }
      otpWrap.classList.add('invalid');
      showAlert(alertBox, 'error', result.error);
      inputs.forEach((i) => (i.value = ''));
      inputs[0].focus();
      return;
    }

    showAlert(alertBox, 'success', 'Account verified! Taking you to EcoAware…');
    submitBtn.disabled = true;
    setTimeout(() => {
      navigate(Auth.ROLE_HOME.reporter);
    }, 900);
  });

  // ---- resend (30 s cooldown) -----------------------------------------------
  const COOLDOWN_SECONDS = 30;
  let timer = null;

  function startCooldown() {
    let left = COOLDOWN_SECONDS;
    resendBtn.disabled = true;
    resendBtn.textContent = `Resend (${left}s)`;
    timer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(timer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend';
      } else {
        resendBtn.textContent = `Resend (${left}s)`;
      }
    }, 1000);
  }

  resendBtn.addEventListener('click', () => {
    const fresh = Auth.resendCode();
    if (!fresh) {
      navigateReplace('reporter-signup.html');
      return;
    }
    inputs.forEach((i) => (i.value = ''));
    clearInvalid();
    inputs[0].focus();
    renderVerificationHint(fresh.code);
    showAlert(alertBox, 'success', 'A new verification code has been sent to your email.');
    startCooldown();
  });
});

};

</script>
<script>

/* ==========================================================================
   SINGLE-FILE ROUTER
   Every page of the site lives in this file as a <template>. Clicking any
   normal .html link (with ?query and #hash) swaps the template into #app,
   sets <body class>/<title>, and runs that page's script. No server needed —
   open this file straight from disk.
   ========================================================================== */
const PAGES = ["index.html", "report.html", "reports.html", "report-pending.html", "report-inprogress.html", "report-resolved.html", "feedback.html", "dashboard.html", "staff.html", "contact.html", "role.html", "profile.html", "reporter-signup.html", "reporter-verify.html", "reporter-login.html", "management-login.html", "staff-login.html", "about.html", "legal.html"];
const DEFAULT_PAGE = 'index.html';
const SPA = { search: '', hash: '', file: DEFAULT_PAGE };

/* Page scripts were written as document.addEventListener('DOMContentLoaded', fn).
   In one file the DOM is already there, so we just run fn. */
function onReady(fn) { fn(); }

/* Listeners added to document/window by a page are dropped on the next
   navigation, so nothing stacks up as you move around. */
let routeAbort = null;

function scopeListeners(run) {
  const dAdd = document.addEventListener.bind(document);
  const wAdd = window.addEventListener.bind(window);
  const withSignal = (opts) =>
    (typeof opts === 'object' && opts !== null)
      ? Object.assign({}, opts, { signal: routeAbort.signal })
      : { capture: !!opts, signal: routeAbort.signal };
  document.addEventListener = (t, h, o) => dAdd(t, h, withSignal(o));
  window.addEventListener = (t, h, o) => wAdd(t, h, withSignal(o));
  try { run(); } finally {
    document.addEventListener = dAdd;
    window.addEventListener = wAdd;
  }
}

function parseTarget(target) {
  let file = String(target || '').trim();
  let query = '', hash = '';
  const h = file.indexOf('#');
  if (h > -1) { hash = file.slice(h + 1); file = file.slice(0, h); }
  const q = file.indexOf('?');
  if (q > -1) { query = file.slice(q); file = file.slice(0, q); }
  file = file.split('/').pop();
  if (!file) file = SPA.file || DEFAULT_PAGE;          // bare "#hash" link
  if (PAGES.indexOf(file) === -1) file = DEFAULT_PAGE; // unknown → home
  return { file: file, query: query, hash: hash };
}

function renderRoute(file, query, hash) {
  const tpl = document.getElementById('tpl-' + file.replace(/\.html$/, ''));
  if (!tpl) return;

  if (routeAbort) routeAbort.abort();
  routeAbort = new AbortController();

  const toast = document.getElementById('auth-toast');
  if (toast) toast.remove();

  SPA.file = file; SPA.search = query; SPA.hash = hash ? '#' + hash : '';

  document.body.className = tpl.dataset.bodyClass || '';
  delete document.body.dataset.role;
  delete document.body.dataset.back;
  if (tpl.dataset.role) document.body.dataset.role = tpl.dataset.role;
  if (tpl.dataset.back) document.body.dataset.back = tpl.dataset.back;
  document.title = tpl.dataset.title;

  document.getElementById('app').innerHTML = tpl.innerHTML;

  const fn = PAGE_SCRIPTS[file.replace(/\.html$/, '')];
  if (fn) {
    rendering = true;
    try { scopeListeners(fn); } finally { rendering = false; }
  }

  if (queuedNav) {
    const next = queuedNav;
    queuedNav = null;
    navigate(next[0], next[1]);
    return;
  }

  const el = hash && document.getElementById(hash);
  if (el && el.scrollIntoView) el.scrollIntoView();
  else if (window.scrollTo) window.scrollTo(0, 0);
}

/* A page script may redirect while it runs (e.g. "no session -> role.html").
   Queue it until the current render finishes, so the page it is leaving never
   has the rug pulled out from under it half-way through. */
let rendering = false;
let queuedNav = null;

function navigate(target, replace) {
  if (rendering) { queuedNav = [target, replace]; return; }
  const r = parseTarget(target);
  try {
    history[replace ? 'replaceState' : 'pushState'](r, '', '#' + r.file + r.query + (r.hash ? '#' + r.hash : ''));
  } catch (e) { /* file:// with no history API — ignore */ }
  renderRoute(r.file, r.query, r.hash);
}

function navigateReplace(target) { navigate(target, true); }

window.addEventListener('popstate', (e) => {
  if (e.state && e.state.file) renderRoute(e.state.file, e.state.query, e.state.hash);
  else routeFromUrl(true);
});

/* Intercept every in-app link. */
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  const href = a.getAttribute('href');
  if (!href || /^(https?:|mailto:|tel:)/i.test(href)) return;
  if (!/\.html(\?[^#]*)?(#.*)?$/.test(href) && href.charAt(0) !== '#') return;
  e.preventDefault();
  navigate(href);
});

/* Deep links: #report-pending.html?id=3 */
function routeFromUrl(replace) {
  const raw = (window.location.hash || '').replace(/^#/, '');
  navigate(raw || DEFAULT_PAGE, replace !== false);
}

routeFromUrl(true);

</script>
</body>
</html>
