<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Eco Aware — Report Detail</title>
  <style>
/* ===== css/styles.css ===== */
/* ==========================================================================
   ECO AWARE — DESIGN TOKENS
   Page 1 (Home) is the master visual reference. Every color, radius and
   shadow used across the app is defined ONCE here and consumed everywhere
   via var(--token). Don't hard-code colors in page-specific CSS.
   ========================================================================== */

:root {
  /* Brand green */
  --primary-green: #1e8449;
  --primary-green-dark: #166638;
  --primary-green-light: #e8f5ec;

  /* Neutrals */
  --background: #f4f6f5;
  --card-background: #ffffff;
  --text-primary: #1a2b22;
  --text-secondary: #6b7a72;
  --border: #e3e8e5;

  /* Status colors */
  --success: #1e8449;
  --success-bg: #e8f5ec;
  --warning: #b7791f;
  --warning-bg: #fdf3dc;
  --info: #2563eb;
  --info-bg: #e8f0fe;
  --danger: #c0392b;

  /* Category tints */
  --cat-water: #2563eb;
  --cat-water-bg: #e8f0fe;
  --cat-waste: #c0392b;
  --cat-waste-bg: #fbe7e5;
  --cat-energy: #b7791f;
  --cat-energy-bg: #fdf3dc;
  --cat-general: #1e8449;
  --cat-general-bg: #e8f5ec;

  /* The ONE floating camera button gradient — Page 1 is the source of truth.
     Used only by .camera-fab. Change it here to change every camera button. */
  --camera-gradient: linear-gradient(135deg, #1e8449 0%, #2563eb 55%, #7c3aed 100%);
  --camera-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);

  /* Sign-in / auth screens (role, profile, sign-up, verify). Colors sampled from the design PDF.
     The three login screens use a slightly different set — see .auth-theme-login in css/auth.css. */
  --auth-green: #13b466;
  --auth-green-dark: #0f9c58;
  --auth-green-soft: #e0f6ea;
  --auth-panel: #143d2b;
  --auth-surface: #f0f4f3;
  --auth-input: #f0f4f3;

  /* Shape & elevation */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 3px rgba(16, 24, 20, 0.06), 0 1px 2px rgba(16, 24, 20, 0.04);
  --shadow-nav: 0 -2px 12px rgba(16, 24, 20, 0.06);

  /* Layout */
  --max-width: 1040px;
  --header-height: 64px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--background);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.page-content {
  flex: 1;
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 24px 24px 120px;
}

@media (max-width: 640px) {
  .page-content { padding: 16px 16px 120px; }
}

/* ==========================================================================
   HEADER
   ========================================================================== */

.site-header {
  background: var(--primary-green);
  color: #fff;
  height: var(--header-height);
  display: flex;
  align-items: center;
  position: relative;
  z-index: 20;
}

.site-header .inner {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

.brand .logo-mark {
  width: 30px;
  height: 30px;
  background: #fff;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary-green);
  font-size: 16px;
}

.brand .brand-name {
  font-weight: 700;
  font-size: 17px;
}

.header-nav {
  display: flex;
  align-items: center;
  gap: 28px;
}

.header-nav a {
  font-size: 14px;
  font-weight: 500;
  opacity: 0.9;
}

.header-nav a.active {
  font-weight: 700;
  opacity: 1;
}

.lang-pill,
.menu-btn {
  background: rgba(255, 255, 255, 0.18);
  border: none;
  color: #fff;
  border-radius: var(--radius-pill);
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}

.header-nav .header-auth-btn {
  background: #fff;
  color: var(--primary-green);
  border: none;
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
  white-space: nowrap;
  opacity: 1;
}

.header-nav .header-auth-btn:hover { opacity: 0.92; }

.menu-btn {
  display: none; /* only shown on phones (see the media query below) */
  border-radius: 8px;
  width: 34px;
  height: 34px;
  padding: 0;
  justify-content: center;
  font-size: 16px;
}

.mobile-menu {
  display: none;
  position: absolute;
  top: 100%;
  right: 24px;
  background: var(--card-background);
  color: var(--text-primary);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 8px;
  min-width: 180px;
}

.mobile-menu.open {
  display: block;
}

.mobile-menu a {
  display: block;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
}

.mobile-menu a:hover {
  background: var(--background);
}

.header-nav-links {
  display: flex;
  gap: 28px;
}

@media (max-width: 760px) {
  .header-nav-links {
    display: none;
  }
  .menu-btn {
    display: flex;
  }
  .header-nav {
    gap: 10px;
  }
  .site-header .inner {
    padding: 0 16px;
  }
  .brand .brand-name {
    white-space: nowrap;
    font-size: 16px;
  }
  .mobile-menu {
    right: 16px;
  }
}

/* ==========================================================================
   BREADCRUMB
   ========================================================================== */

.breadcrumb {
  border-bottom: 1px solid var(--border);
  background: var(--card-background);
}

.breadcrumb .inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 12px 24px;
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.breadcrumb .crumb.current {
  color: var(--primary-green);
  font-weight: 600;
}

/* ==========================================================================
   CAMERA FLOATING BUTTON — the ONE implementation, used on every page.
   ========================================================================== */

.camera-fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--camera-gradient);
  box-shadow: var(--camera-shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: #fff;
  font-size: 22px;
}

/* ==========================================================================
   BOTTOM NAVIGATION
   ========================================================================== */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card-background);
  box-shadow: var(--shadow-nav);
  z-index: 30;
}

.bottom-nav .inner {
  max-width: var(--max-width);
  margin: 0 auto;
  display: flex;
  align-items: center;
  padding: 10px 20px;
  position: relative;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  flex: 1;
}

.nav-item.active {
  color: var(--primary-green);
  font-weight: 600;
}

.nav-item .icon {
  font-size: 19px;
  line-height: 1;
}

.nav-camera-slot {
  flex: 1;
  display: flex;
  justify-content: center;
}

.nav-camera-slot .camera-fab {
  margin-top: -28px;
}

/* ==========================================================================
   FOOTER
   ========================================================================== */

.site-footer {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-secondary);
  font-size: 13px;
}

/* ==========================================================================
   CARD
   ========================================================================== */

.card {
  background: var(--card-background);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-card);
}

/* ==========================================================================
   BADGES
   ========================================================================== */

.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  border-radius: var(--radius-pill);
  padding: 4px 12px;
  white-space: nowrap;
}

.badge-resolved { color: var(--success); background: var(--success-bg); }
.badge-in-progress { color: var(--warning); background: var(--warning-bg); }
.badge-pending { color: var(--info); background: var(--info-bg); }

.cat-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  padding: 3px 10px;
}

.cat-water { color: var(--cat-water); background: var(--cat-water-bg); }
.cat-waste { color: var(--cat-waste); background: var(--cat-waste-bg); }
.cat-energy { color: var(--cat-energy); background: var(--cat-energy-bg); }
.cat-general { color: var(--cat-general); background: var(--cat-general-bg); }

/* ==========================================================================
   BUTTONS
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  border-radius: var(--radius-sm);
  padding: 13px 22px;
  border: none;
  transition: opacity 0.15s ease;
}

.btn:hover { opacity: 0.92; }

.btn-primary { background: var(--primary-green); color: #fff; }
.btn-full { width: 100%; }

.btn-pill-outline {
  background: #fff;
  color: var(--primary-green);
  border: 1px solid var(--primary-green);
  border-radius: var(--radius-pill);
}

.btn-pill-white {
  background: #fff;
  color: var(--primary-green);
  border-radius: var(--radius-pill);
}

/* ==========================================================================
   FORM CONTROLS
   ========================================================================== */

.field-label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
}

.field-label .req { color: var(--danger); }

.field-control {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  background: #fff;
  outline: none;
}

.field-control:focus {
  border-color: var(--primary-green);
}

select.field-control {
  appearance: none;
}

.select-wrap {
  position: relative;
}

.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  pointer-events: none;
}

textarea.field-control {
  resize: vertical;
}

.field-error {
  color: var(--danger);
  font-size: 12.5px;
  margin-top: 6px;
}

.info-box {
  background: var(--success-bg);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13.5px;
  color: var(--text-primary);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.info-box.tone-notice {
  background: var(--info-bg);
}

.form-group {
  margin-bottom: 22px;
}

/* ==========================================================================
   HOME PAGE
   ========================================================================== */

.hero {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  min-height: 220px;
  display: flex;
  align-items: center;
  padding: 40px;
  margin-bottom: 24px;
  background-image: linear-gradient(120deg, rgba(20, 90, 55, 0.92), rgba(30, 132, 73, 0.75)),
    url('https://images.unsplash.com/photo-1518005020951-eccb494ad742?q=80&w=1400&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
}

.hero .inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  flex-wrap: wrap;
  gap: 20px;
}

.hero h1 {
  color: #fff;
  font-size: 32px;
  margin: 0 0 12px;
}

.hero p {
  color: rgba(255, 255, 255, 0.9);
  font-size: 15px;
  margin: 0;
  line-height: 1.6;
  max-width: 480px;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

@media (max-width: 700px) {
  .stats-grid { grid-template-columns: 1fr; }
}

.card-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.card-header-row h3 { margin: 0; font-size: 16px; }

.stat-row { display: flex; gap: 24px; }
.stat-divider { width: 1px; background: var(--border); }
.stat-value { font-size: 26px; font-weight: 700; color: var(--primary-green); }
.stat-label { font-size: 12.5px; color: var(--text-secondary); }

.activity-empty {
  text-align: center;
  padding: 18px 8px;
  color: var(--text-secondary);
}

.activity-empty .title {
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-primary);
}

.activity-empty .desc { font-size: 13px; line-height: 1.5; }

.guidelines-list {
  margin: 0;
  padding-left: 18px;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.9;
}

/* ==========================================================================
   REPORT ISSUE PAGE
   ========================================================================== */

.capture-box {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  background: #fafcfb;
}

.capture-box.has-image {
  background: transparent;
  padding: 12px;
}

.capture-box img {
  max-height: 180px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  margin: 0 auto;
}

.capture-icon-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--primary-green-light);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  color: var(--primary-green);
  font-size: 18px;
}

.capture-box .hint {
  font-size: 14px;
  color: var(--text-secondary);
}

/* ==========================================================================
   FEEDBACK PAGE
   ========================================================================== */

.star-row { display: flex; gap: 6px; }

.star-btn {
  background: none;
  border: none;
  padding: 2px;
  font-size: 26px;
  color: var(--border);
}

.star-btn.filled { color: #e0a63e; }

/* ==========================================================================
   MY REPORTS PAGE
   ========================================================================== */

.filter-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.tab-btn {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-primary);
  border-radius: var(--radius-pill);
  padding: 8px 18px;
  font-size: 13.5px;
  font-weight: 600;
}

.tab-btn.active {
  border: none;
  background: var(--primary-green);
  color: #fff;
}

.report-card { margin-bottom: 16px; }

.report-card-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.report-card-top h3 { margin: 0; font-size: 16px; }

.report-card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-secondary);
}

.report-card-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0 0 14px;
  line-height: 1.5;
}

.report-card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.report-card-id {
  font-size: 12.5px;
  color: var(--text-secondary);
}

.view-details-link {
  background: none;
  border: none;
  color: var(--primary-green);
  font-weight: 600;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.empty-state {
  text-align: center;
  color: var(--text-secondary);
  padding: 40px 0;
}

/* ==========================================================================
   REPORT DETAIL PAGES
   ========================================================================== */

.detail-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 8px;
}

.detail-top h1 { font-size: 24px; margin: 0; }

.detail-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  font-size: 13.5px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.notice-box {
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
  font-size: 14px;
}

.notice-success { background: var(--success-bg); color: var(--text-primary); }
.notice-info { background: var(--info-bg); color: var(--text-primary); }

.notice-warning-block {
  background: var(--warning-bg);
  color: var(--warning);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 600;
}

.section-title { font-size: 15px; margin: 0 0 12px; }

.image-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 22px;
}

@media (max-width: 600px) {
  .image-grid { grid-template-columns: 1fr; }
}

.image-block {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
}

.image-block img { width: 100%; height: 190px; object-fit: cover; }

.image-tag {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

.tag-before { color: var(--danger); }
.tag-after { color: var(--success); }

.summary-row {
  display: flex;
  gap: 16px;
  margin-bottom: 10px;
  font-size: 14px;
}

.summary-row .label {
  width: 130px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

/* ==========================================================================
   TIMELINE
   ========================================================================== */

.timeline-step {
  display: flex;
  gap: 14px;
}

.timeline-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.timeline-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
  background: var(--border);
}

.timeline-dot.done { background: var(--success); }
.timeline-dot.active { background: var(--warning); }

.timeline-line {
  width: 2px;
  flex: 1;
  background: var(--border);
  min-height: 28px;
}

.timeline-body { padding-bottom: 18px; }
.timeline-body:last-child { padding-bottom: 0; }

.timeline-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
.timeline-title.active { color: var(--warning); }
.timeline-date { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
.timeline-note { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* ==========================================================================
   PLACEHOLDER PAGE
   ========================================================================== */

.placeholder-title { font-size: 26px; margin: 0 0 6px; }
.placeholder-desc { color: var(--text-secondary); margin: 0 0 24px; font-size: 14.5px; }

/* ===== keeps the fixed bottom nav clear of phone system bars ===== */
@supports (padding: env(safe-area-inset-bottom)) {
  .bottom-nav { padding-bottom: env(safe-area-inset-bottom, 0px); }
}

</style>

  <div class="app-shell">
    <div id="header-root"></div>
    <div id="breadcrumb-root"></div>

    <main class="page-content" id="detail-content">
      <!-- filled by report-resolved.js -->
    </main>

    <div id="footer-root"></div>
    <div id="bottomnav-root"></div>

  <script src="shared/config.js"></script>
<script>
// Category labels, and the adapter that reshapes a real backend report into
// the field names these templates render (toLegacyReport(), below).

const CATEGORIES = [
  { value: 'waste', label: 'Waste' },
  { value: 'water', label: 'Water' },
  { value: 'energy', label: 'Energy' },
  { value: 'general', label: 'General / Other' },
];

const FEEDBACK_CATEGORIES = [
  { value: 'cleanliness', label: 'Campus Cleanliness' },
  { value: 'energy', label: 'Energy' },
  { value: 'water', label: 'Water' },
  { value: 'general', label: 'General' },
];

// Reports come from the real backend (Stage 3 API): GET/POST /api/reports/*.
const STATUS_TO_API = { pending: 'Pending', 'in-progress': 'In Progress', resolved: 'Resolved' };
const API_TO_STATUS = { Pending: 'pending', 'In Progress': 'in-progress', Resolved: 'resolved' };

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

// Reshapes a backend report (list-summary or full detail) into the same
// field names every page here already renders, so the templates didn't
// have to change much — id, status and category are the mock-style values,
// the real UUID is kept on _id for pages that need to call the API again.
function toLegacyReport(r) {
  const hasPhotosObj = r.photos && typeof r.photos === 'object' && !Array.isArray(r.photos);
  const reportedUrls = hasPhotosObj ? (r.photos.reported || []).map((p) => p.url) : (r.thumbnail ? [r.thumbnail] : []);
  const before = hasPhotosObj && r.photos.before && r.photos.before[0] ? r.photos.before[0].url : '';
  const after = hasPhotosObj && r.photos.after && r.photos.after[0] ? r.photos.after[0].url : '';
  const timeline = (r.steps || []).map((s) => ({
    label: s.step,
    date: s.at ? formatDate(s.at) : (s.state === 'upcoming' ? 'Upcoming step' : ''),
    active: s.state === 'current',
    done: s.state === 'done',
    note: s.note,
  }));

  return {
    id: r.reportCode || r.id,
    _id: r.id,
    title: r.title,
    category: API_TO_CATEGORY[r.category] || 'general',
    status: API_TO_STATUS[r.status] || 'pending',
    submittedOn: formatDate(r.createdAt),
    resolvedOn: formatDate(r.resolvedAt),
    description: r.description,
    photos: reportedUrls,
    statusInfo:
      'Your report is currently in the campus sustainability operations queue and will be reviewed by the facilities team shortly.',
    averageReviewTime: '2-3 business days',
    timeline,
    estimatedCompletion: r.estimatedCompletion ? formatDate(r.estimatedCompletion) : 'to be confirmed',
    before,
    after,
    resolvedBy: r.resolution ? r.resolution.resolvedBy || '' : '',
    dateResolved: r.resolution ? formatDate(r.resolution.resolvedAt) : '',
    actionTaken: r.resolution ? r.resolution.actionTaken || '' : '',
  };
}

const Reports = {
  /** GET /reports/mine[?status=] -> { reports: [legacy-shaped], counts } */
  async list(status) {
    const qs = status && status !== 'all' ? `?status=${encodeURIComponent(STATUS_TO_API[status])}` : '';
    const data = await apiFetch(`/reports/mine${qs}`);
    return { reports: data.reports.map(toLegacyReport), counts: data.counts };
  },

  /** GET /reports/:id — id can be the EA-2026-0001 code or the raw UUID. */
  async getById(id) {
    try {
      const data = await apiFetch(`/reports/${encodeURIComponent(id)}`);
      return toLegacyReport(data.report);
    } catch (e) {
      return null;
    }
  },

  /**
   * POST /reports, multipart/form-data (fetch's JSON helper can't send files).
   * @param {{category:string, description:string, photoFile:File}} fields
   */
  async create({ category, description, photoFile }) {
    const form = new FormData();
    form.append('category', CATEGORY_TO_API[category] || 'Other');
    form.append('description', description);
    if (photoFile) form.append('photos', photoFile);

    const session = AuthStore.read(localStorage, AUTH_STORAGE.session, null);
    const headers = {};
    if (session && session.token) headers.Authorization = `Bearer ${session.token}`;

    let res;
    try {
      res = await fetch(`${API_BASE}/reports`, { method: 'POST', headers, body: form });
    } catch (e) {
      throw new Error(`Could not reach the server at ${API_BASE}. Is the backend running?`);
    }
    let data = null;
    try {
      data = await res.json();
    } catch (e) {
      /* empty body */
    }
    if (!res.ok) {
      const message = (data && (data.message || data.error)) || `Request failed (${res.status})`;
      const err = new Error(message);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return toLegacyReport(data.report);
  },
};

const CATEGORY_LABELS = Object.fromEntries(CATEGORIES.map((c) => [c.value, c.label]));

  <script>
/* ===== js/auth.js ===== */
// ============================================================================
// AUTH SERVICE
//
// Talks to the real backend (POST /api/auth/*). This file is the ONLY place
// that knows how auth works — every page calls the `Auth` object below, which
// wraps apiFetch() and stores the returned JWT (see AUTH_STORAGE) so later
// requests can send it as a Bearer token.
//
// The backend is the actual authority: it re-checks the token and the user's
// role server-side on every request (see Backend/src/middleware/auth.js).
// ============================================================================

const AUTH_STORAGE = {
  users: 'ea_users',           // no longer used client-side — accounts live in the backend now
  session: 'ea_session',       // who is signed in (localStorage) — now includes a real JWT token
  pending: 'ea_pending_signup' // sign-up awaiting email verification (sessionStorage)
};

// Where each role lands after a successful sign-in.
const ROLE_HOME = {
  reporter: 'index.html',
  management: 'dashboard.html',
  staff: 'staff.html',
};

// API_BASE, CATEGORY_TO_API and API_TO_CATEGORY come from shared/config.js
// (loaded before this script — see that file to change the backend's address).

const AuthStore = {
  read(storage, key, fallback) {
    try {
      const raw = storage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  write(storage, key, value) {
    try {
      storage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  },
  remove(storage, key) {
    try {
      storage.removeItem(key);
    } catch (e) {
      /* storage unavailable — nothing to remove */
    }
  },
};

/**
 * Thin fetch wrapper: sends JSON, attaches the bearer token from the current
 * session (unless auth:false), and throws an Error with a readable .message
 * on any non-2xx response. err.status / err.data carry the raw response.
 */
async function apiFetch(path, { method = 'GET', body, auth = true } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth) {
    const session = AuthStore.read(localStorage, AUTH_STORAGE.session, null);
    if (session && session.token) headers.Authorization = `Bearer ${session.token}`;
  }

  let res;
  try {
    res = await fetch(`${API_BASE}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw new Error(`Could not reach the server at ${API_BASE}. Is the backend running?`);
  }

  let data = null;
  try {
    data = await res.json();
  } catch (e) {
    /* empty or non-JSON body */
  }

  if (!res.ok) {
    if (res.status === 401 && auth) {
      // Token missing/expired/invalid — drop the stale session.
      AuthStore.remove(localStorage, AUTH_STORAGE.session);
    }
    const message = (data && (data.message || data.error)) || `Request failed (${res.status})`;
    const err = new Error(message);
    err.status = res.status;
    err.data = data;
    throw err;
  }

  return data;
}

// ---- public API --------------------------------------------------------------

const Auth = {
  ROLE_HOME,

  getSession() {
    return AuthStore.read(localStorage, AUTH_STORAGE.session, null);
  },

  // Call at the very top of any app-page script (before DOMContentLoaded), the
  // same way home.js does. Sends signed-out visitors to Select Your Role and
  // returns false so the caller can bail out before touching the DOM.
  requireSession() {
    if (this.getSession()) return true;
    location.replace('role.html');
    return false;
  },

  logout() {
    AuthStore.remove(localStorage, AUTH_STORAGE.session);
  },

  _startSession(role, name, id, token) {
    const session = { role, name, id, token, at: Date.now() };
    AuthStore.write(localStorage, AUTH_STORAGE.session, session);
    return session;
  },

  /**
   * Step 1 of reporter sign-up. Calls POST /auth/signup. On success the
   * backend has emailed a 6-digit code (or, in local dev with no SMTP set up,
   * returns it directly as devCode so you can still test the flow).
   * @returns {Promise<{ok:true, pending:object} | {ok:false, field?:string, error:string}>}
   */
  async startSignUp({ email, username, phone, password }) {
    try {
      const data = await apiFetch('/auth/signup', {
        method: 'POST',
        auth: false,
        body: { email, username, phone, password },
      });
      const pending = {
        email: (data.email || email).trim().toLowerCase(),
        username: username.trim(),
        referenceCode: data.reference || '',
        devCode: data.devCode || null,
      };
      AuthStore.write(sessionStorage, AUTH_STORAGE.pending, pending);
      return { ok: true, pending };
    } catch (e) {
      const errors = e.data && e.data.errors;
      const field = errors ? Object.keys(errors)[0] : undefined;
      return { ok: false, field, error: (field && errors[field]) || e.message };
    }
  },

  getPending() {
    return AuthStore.read(sessionStorage, AUTH_STORAGE.pending, null);
  },

  /** Issues a fresh code via POST /auth/resend-code. */
  async resendCode() {
    const pending = this.getPending();
    if (!pending) return null;
    try {
      const data = await apiFetch('/auth/resend-code', {
        method: 'POST',
        auth: false,
        body: { email: pending.email },
      });
      pending.devCode = data.devCode || null;
      pending.referenceCode = data.reference || pending.referenceCode;
      AuthStore.write(sessionStorage, AUTH_STORAGE.pending, pending);
      return pending;
    } catch (e) {
      return null;
    }
  },

  /**
   * Step 2 of reporter sign-up. Calls POST /auth/verify-email. On success the
   * account is verified and the backend signs the reporter in immediately.
   * @returns {Promise<{ok:true, session:object} | {ok:false, reason?:string, error:string}>}
   */
  async verifyCode(input) {
    const pending = this.getPending();
    if (!pending) {
      return { ok: false, reason: 'no-pending', error: 'Your sign-up session has expired. Please start again.' };
    }
    try {
      const data = await apiFetch('/auth/verify-email', {
        method: 'POST',
        auth: false,
        body: { email: pending.email, code: input },
      });
      AuthStore.remove(sessionStorage, AUTH_STORAGE.pending);
      return { ok: true, session: this._startSession(data.user.role, data.user.username, data.user.email, data.token) };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  },

  /**
   * @param {'reporter'|'management'|'staff'} role
   * @param {string} identifier - email (reporter/management) or staff ID / email (staff)
   * @returns {Promise<{ok:true, session:object} | {ok:false, error:string, requiresVerification?:boolean}>}
   */
  async login(role, identifier, password) {
    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        auth: false,
        body: { identifier, password, portal: role },
      });
      return { ok: true, session: this._startSession(data.user.role, data.user.username, data.user.email, data.token) };
    } catch (e) {
      if (e.data && e.data.requiresVerification) {
        AuthStore.write(sessionStorage, AUTH_STORAGE.pending, {
          email: e.data.email,
          username: '',
          referenceCode: '',
        });
        return { ok: false, error: e.message, requiresVerification: true };
      }
      return { ok: false, error: e.message || 'Incorrect email or password. Please try again.' };
    }
  },
};
</script>
  <script>
/* ===== js/components.js ===== */
// ============================================================================
// SHARED COMPONENTS
// These functions are the single source of truth for markup that repeats on
// every page. In particular, renderBottomNav() is the ONLY place in the whole
// project that draws the floating camera button — every page calls it, so
// there is exactly one camera button design across the entire app.
// ============================================================================

const NAV_LINKS = [
  { label: 'Home', href: 'index.html' },
  { label: 'My Reports', href: 'reports.html' },
  { label: 'Service', href: 'report.html' },
  { label: 'Contact Us', href: 'contact.html' },
];

// Staff and management have their own portals. Reporters must never be sent there
// (those pages bounce them back to Home), so the "Dashboard" link depends on the role.
function navLinksFor(session) {
  const role = session && session.role;
  const portal = role === 'staff' ? 'staff.html' : role === 'management' ? 'dashboard.html' : null;
  if (!portal) return NAV_LINKS;
  return NAV_LINKS.map((l) => (l.href === 'reports.html' ? { label: 'Dashboard', href: portal } : l));
}

// The 4th slot of the bottom bar: each role gets a link it is actually allowed to open.
function portalNavItem(session) {
  const role = session && session.role;
  if (role === 'staff') return { key: 'staff', label: 'Staff', href: 'staff.html', icon: '👥' };
  if (role === 'management') return { key: 'dashboard', label: 'Dashboard', href: 'dashboard.html', icon: '📊' };
  return { key: 'about', label: 'About', href: 'about.html', icon: 'ℹ️' };
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/**
 * @param {string} activeHref - current page's file name, e.g. "index.html"
 */
function renderHeader(activeHref) {
  const root = document.getElementById('header-root');
  if (!root) return;

  const session = typeof Auth !== 'undefined' ? Auth.getSession() : null;
  const linksHtml = navLinksFor(session).map(
    (link) =>
      `<a href="${link.href}" class="${link.href === activeHref ? 'active' : ''}">${link.label}</a>`
  ).join('');

  // Sign In / Sign Out (session comes from js/auth.js)
  const authBtnHtml = session
    ? `<button type="button" class="header-auth-btn" id="signout-btn" title="Signed in as ${escapeHtml(session.name)}">Sign Out</button>`
    : `<a href="role.html" class="header-auth-btn">Sign In</a>`;

  root.innerHTML = `
    <header class="site-header">
      <div class="inner">
        <a href="index.html" class="brand">
          <span class="logo-mark">🍃</span>
          <span class="brand-name">Eco Aware</span>
        </a>
        <nav class="header-nav">
          <span class="header-nav-links">${linksHtml}</span>
          <button class="lang-pill">🌐 EN ▾</button>
          ${authBtnHtml}
          <button class="menu-btn" id="mobile-menu-toggle" aria-label="Open menu">☰</button>
        </nav>
      </div>
      <div class="mobile-menu" id="mobile-menu">${linksHtml}</div>
    </header>
  `;

  const signOut = document.getElementById('signout-btn');
  if (signOut) {
    signOut.addEventListener('click', () => {
      Auth.logout();
      window.location.href = 'role.html';
    });
  }

  const toggle = document.getElementById('mobile-menu-toggle');
  const menu = document.getElementById('mobile-menu');
  if (toggle && menu) {
    toggle.addEventListener('click', () => menu.classList.toggle('open'));
  }
}

/**
 * @param {Array<{label: string, href?: string}>} trail - last item has no href (current page)
 */
function renderBreadcrumb(trail) {
  const root = document.getElementById('breadcrumb-root');
  if (!root) return;

  const html = trail
    .map((item, i) => {
      const isLast = i === trail.length - 1;
      const sep = isLast ? '' : '<span>/</span>';
      const crumb =
        item.href && !isLast
          ? `<a href="${item.href}">${escapeHtml(item.label)}</a>`
          : `<span class="crumb ${isLast ? 'current' : ''}">${escapeHtml(item.label)}</span>`;
      return `<span style="display:flex; gap:6px;">${crumb}${sep}</span>`;
    })
    .join('');

  root.innerHTML = `
    <div class="breadcrumb">
      <div class="inner">${html}</div>
    </div>
  `;
}

/**
 * The ONE camera floating button implementation. Style source of truth:
 * --camera-gradient / --camera-shadow in css/styles.css.
 */
function cameraFabHtml() {
  return `
    <a href="report.html" class="camera-fab" aria-label="Report an issue">📷</a>
  `;
}

/**
 * @param {string} activePage - one of 'home' | 'feedback' | 'reports' | 'staff' | ''
 */
function renderBottomNav(activePage) {
  const root = document.getElementById('bottomnav-root');
  if (!root) return;

  const portal = portalNavItem(typeof Auth !== 'undefined' ? Auth.getSession() : null);
  const isActive = (key) => (activePage === key ? 'active' : '');

  root.innerHTML = `
    <nav class="bottom-nav">
      <div class="inner">
        <a href="index.html" class="nav-item ${isActive('home')}">
          <span class="icon">🏠</span>Home
        </a>
        <a href="feedback.html" class="nav-item ${isActive('feedback')}">
          <span class="icon">💬</span>Feedback
        </a>
        <div class="nav-camera-slot">${cameraFabHtml()}</div>
        <a href="reports.html" class="nav-item ${isActive('reports')}">
          <span class="icon">📄</span>Reports
        </a>
        <a href="${portal.href}" class="nav-item ${isActive(portal.key)}">
          <span class="icon">${portal.icon}</span>${portal.label}
        </a>
      </div>
    </nav>
  `;
}

function renderFooter() {
  const root = document.getElementById('footer-root');
  if (!root) return;
  root.innerHTML = `
    <footer class="site-footer">
      <div>© ${new Date().getFullYear()} Eco Aware. All rights reserved.</div>
      <div>Committed to a greener, cleaner campus.</div>
    </footer>
  `;
}

function statusBadgeHtml(status) {
  const map = {
    resolved: { label: 'Resolved', cls: 'badge-resolved' },
    'in-progress': { label: 'In Progress', cls: 'badge-in-progress' },
    pending: { label: 'Pending Review', cls: 'badge-pending' },
  };
  const s = map[status] || map.pending;
  return `<span class="badge ${s.cls}">${s.label}</span>`;
}

function categoryBadgeHtml(category) {
  const map = {
    water: { label: 'Water', cls: 'cat-water' },
    waste: { label: 'Waste', cls: 'cat-waste' },
    energy: { label: 'Energy', cls: 'cat-energy' },
    general: { label: 'General', cls: 'cat-general' },
  };
  const c = map[category] || map.general;
  return `<span class="cat-badge ${c.cls}">${c.label}</span>`;
}

/** Call once per page after the DOM is ready. */
function renderShell({ activeHeaderHref, breadcrumb, activeNav }) {
  renderHeader(activeHeaderHref);
  if (breadcrumb) renderBreadcrumb(breadcrumb);
  renderFooter();
  renderBottomNav(activeNav);
}

</script>

document.addEventListener('DOMContentLoaded', async () => {
